<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asteroid2Shiba Mining</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0a0a0a; color: #fff; text-align: center; padding: 50px 20px; }
        .container { background: #1a1a1a; padding: 30px; border-radius: 15px; max-width: 400px; margin: auto; border: 2px solid #ff9500; }
        h1 { color: #ff9500; }
        #poin { font-size: 40px; font-weight: bold; color: #00ff88; margin: 20px 0; }
        button { background: #ff9500; color: #000; border: none; padding: 15px 30px; font-size: 18px; font-weight: bold; border-radius: 10px; cursor: pointer; width: 100%; }
        button:active { background: #ffb84d; }
        #status { margin-top: 15px; color: #aaa; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Asteroid2Shiba</h1>
        <p>Poin Kamu:</p>
        <div id="poin">0</div>
        <button id="btnMining">Mining +1000</button>
        <p id="status">Klik untuk mulai mining</p>
    </div>

    <!-- Firebase SDK Versi Web -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
      import { getFirestore, doc, setDoc, getDoc, increment } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

      // 1. INI FIREBASECONFIG PUNYA KAMU - UDAH AKU LENGKAPIN
      const firebaseConfig = {
        apiKey: "AIzaSyAa7a5D6JlY4u4XdmDMH6_wY8FDWpBsKwk",
        authDomain: "asteroid2shiba-67db6.firebaseapp.com",
        projectId: "asteroid2shiba-67db6",
        storageBucket: "asteroid2shiba-67db6.firebasestorage.app",
        messagingSenderId: "519970187517",
        appId: "1:519970187517:web:a0e85a6a4e7c34a0c87694"
      };

      // 2. INISIALISASI
      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);

      // 3. ID USER SEMENTARA
      const userId = "user_test_123"; 

      const poinEl = document.getElementById('poin');
      const btn = document.getElementById('btnMining');
      const statusEl = document.getElementById('status');

      // AMBIL DATA POIN SAAT BUKA
      async function loadPoin() {
        const docRef = doc(db, "users", userId);
        const docSnap = await getDoc(docRef);
        if (docSnap.exists()) {
          poinEl.innerText = docSnap.data().poin;
        }
      }
      loadPoin();

      // KETIKA TOMBOL DIKLIK
      btn.addEventListener('click', async () => {
        statusEl.innerText = "Menyimpan...";
        const docRef = doc(db, "users", userId);
        
        await setDoc(docRef, { poin: increment(1000) }, { merge: true });
        
        await loadPoin();
        statusEl.innerText = "Berhasil! +1000 Poin";
        setTimeout(() => statusEl.innerText = "Klik untuk mining lagi", 2000);
      });
    </script>
</body>
</html>
